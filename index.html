<script>


    let myDate = new Date();

    let year = myDate.getFullYear();
    let month = myDate.getMonth() + 1;
    let day = myDate.getDate();
    let TheDate = day + "/" + month + "/" + year;

    let tasks =
        [
            {
                "title": "reading",
                "date": TheDate,
                "done": false
            },
            {
                "title": "sleep",
                "date": TheDate,
                "done": false
            },
            {
                "title": "do homework",
                "date": TheDate,
                "done": false
            }
        ];


        function getTaskFromJOSN(){
            let reTASKS = JSON.parse(localStorage.getItem("tasks"))
            tasks = reTASKS ?? [];
        }
        
        getTaskFromJOSN();


    function ArrayCall() {
        document.getElementById("tasks").innerHTML = "";

        for (let i = 0; i < tasks.length; i++) {
            let task = tasks[i];
            let TheTask =
                `               
                    <!-- TASK -->
                    <div class="task ${task.done ? 'done' : ''}" data-index="${i}">
                        <!-- TASK INFO -->
                        <div style="width: 70%; text-align: right; padding: 15px;">
                            <h2>${task.title}</h2>
                            <div>
                                <span class="material-symbols-outlined" style="font-size: 14px;">
                                    calendar_today
                                </span>
                                <span>
                                    ${task.date}
                                </span>
                            </div>
                        </div>
                        <!-- //TASK INFO //-->
                        <!-- TASK ACTIONS -->
                        <div
                            style="width: 20%; display: flex; justify-content: space-between; text-align: center; padding: 20px;">
                            <button class="actionbut delete" style="background-color: rgb(187, 0, 0); color: white;"
                                  data-index="${i}">
                                <span class="material-symbols-outlined">
                                    delete
                                </span>
                            </button>

                            ${task.done ? 
                            `
                                <button class="actionbut check"
                                        style="background-color: #ff3366; color: white;" data-index="${i}">
                                        <span class="material-symbols-outlined">
                                        cancel
                                        </span>
                                </button>
                            ` 
                            :
                            `
                                <button class="actionbut check"
                                    style="background-color: rgba(2 , 188 , 11); color: white;" data-index="${i}">
                                    <span class="material-symbols-outlined">
                                        check
                                    </span>
                                </button>
                            `}
                            


                            <button class="actionbut edit" style="background-color: rgb(99, 112, 255); color: white;"
                                 data-index="${i}">
                                <span class="material-symbols-outlined">
                                    edit
                                </span>
                            </button>
                        </div>
                        <!-- //TASK ACTIONS //-->
                    </div>
                    <!--// TASK //-->

            `;
            document.getElementById("tasks").innerHTML += TheTask;


            // ACTION BUTTON SHADOW
            document.querySelectorAll('.actionbut').forEach(button => {
                button.addEventListener('mouseover', function () {
                    this.style.backgroundColor
                    this.style.boxShadow = `0px 4px 10px ${this.style.backgroundColor}`;
                });
                button.addEventListener('mouseout', function () {
                    this.style.boxShadow = 'none';
                });
            });
            // ACTION BUTTON SHADOW //




        };


        // DELETE TASK
        document.querySelectorAll(".delete[data-index]").forEach(button => {
            button.addEventListener("click", function () {
                let index = parseInt(this.getAttribute('data-index'));
                let ThIs = tasks[index];
                let a = confirm("do you want delete " + ThIs.title);
                if (a) {
                    tasks.splice(index, 1);
                    localStorage1()
                    ArrayCall();
                };
            });
        });
        // DELETE TASK //


        // EDIT TASK
        document.querySelectorAll(".edit[data-index]").forEach(button => {
            button.addEventListener("click", function () {
                let index = parseInt(this.getAttribute('data-index'));
                let theEditingTask = tasks[index].title;
                let EdTask = prompt("write you editing ", theEditingTask);
                if (EdTask != "" && EdTask != null) {
                    tasks[index].title = EdTask;
                    localStorage1()
                    ArrayCall();
                };
            });
        });
        // EDIT TASK //

        // CHECK 
        document.querySelectorAll(".check[data-index]").forEach(button => {
            button.addEventListener("click", function () {
                let index = parseInt(this.getAttribute('data-index'));
                console.log(index)
                let thisCHeckIndex = tasks[index];
                thisCHeckIndex.done = !thisCHeckIndex.done 
                localStorage1()
                ArrayCall();
            });
        });
        // CHECK //
    };

    ArrayCall();

    document.getElementById("butHead").addEventListener("click", function AddNewTask() {
        let TextOfNewTask = prompt("Enter the new task");
        if (TextOfNewTask != "" && TextOfNewTask != null) {
            let TheNewTask = {
                "title": TextOfNewTask,
                "date": TheDate,
                "done": false
            };
            tasks.push(TheNewTask)
            localStorage1()
            ArrayCall();
        };
    });

    function localStorage1(){
        let newStringArray = JSON.stringify(tasks)
        localStorage.setItem("tasks" , newStringArray)
    }

</script>
